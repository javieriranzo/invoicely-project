schema: spec-driven

context: |
  Proyecto: Invoicely App, ERP ligero (SPA) para pequeñas empresas que operan en España.
  Idioma: artefactos (proposal, design, tasks, specs) en español. Identificadores de código,
  API y base de datos en inglés. La interfaz de usuario es solo en español.
  Mantén en inglés las cabeceras estructurales y palabras clave que exige el validador de
  OpenSpec (## ADDED Requirements, ### Requirement:, #### Scenario:, SHALL/MUST, WHEN/THEN).
  Aprobación: el responsable del proyecto aprueba toda decisión tecnológica (framework,
  librería, servicio, dependencia importante). Nunca se adopta una tecnología no aprobada;
  las aprobadas constan en los ADR de docs/adr/.
  No se inventan requisitos funcionales ni reglas de negocio: lo no acordado se registra
  como "Cuestión abierta" y se pregunta.
  Reglas fiscales (facturación, impuestos, rectificativas, Verifactu): solo a partir de la
  normativa española investigada y citada; nunca presupuestas.
  Seguridad: toda operación privada exige autenticación y el backend verifica siempre los permisos.

rules:
  proposal:
    - Indica explícitamente qué queda fuera de alcance.
    - Enumera las decisiones tecnológicas o de negocio pendientes de aprobación.
  design:
    - Separa los cambios de base de datos, API y frontend en apartados propios.
  tasks:
    - Cada tarea debe tener un criterio de verificación comprobable (test, comando o revisión manual descrita).
    - Incluye tareas de tests y de actualización de documentación.
  specs:
    - Cada requisito debe tener al menos un escenario de aceptación.

operations:
  apply:
    guidance:
      - Implementa solo las tareas de una propuesta aprobada por el responsable del proyecto.
      - No marques una tarea como completada sin evidencia de verificación (salida de tests o comprobación).
  archive:
    guidance:
      - Archiva solo tras ejecutar /opsx:verify sin incidencias críticas y con los tests en verde.
